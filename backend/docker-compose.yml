# Explicit project name so this stack never collides with a sibling project
# that also lives in a `backend/` directory (Compose otherwise derives the
# project name from the directory and would adopt/recreate the other's
# containers and volumes).
name: scaffold

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: scaffold-backend:dev
    container_name: scaffold-backend
    network_mode: host
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Self-contained Postgres for local/deploy use, bound to the host network so
  # the backend reaches it via localhost:5432 with a plain DATABASE_URL.
  # S3 storage stays disabled (S3_ENDPOINT unset in .env.local) per the plan's
  # constraints, so there's no MinIO service here.
  #
  # Data is bind-mounted to a host path (ZFS dataset on the Proxmox deploy
  # target) rather than a named Docker volume, so `docker compose down -v`
  # can't accidentally wipe it and it's covered by whatever host-level backup
  # policy applies to /tank. See DEPLOY.md for provisioning that path.
  postgres:
    image: postgres:16
    container_name: scaffold-postgres
    network_mode: host
    environment:
      POSTGRES_USER: strongnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: strongnotes
    volumes:
      - ${POSTGRES_DATA_DIR:-./.pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strongnotes"]
      interval: 5s
      timeout: 3s
      retries: 5
